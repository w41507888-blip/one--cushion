<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#233f63"><meta name="apple-mobile-web-app-capable" content="yes"><title>ワンクッション v4</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#18283a;background:#f3f5f8}*{box-sizing:border-box}body{max-width:650px;margin:auto;padding:env(safe-area-inset-top) 16px calc(32px + env(safe-area-inset-bottom))}h1{font-size:25px;margin-bottom:5px}h2{font-size:18px;margin:0 0 13px}.muted,small{color:#5d6978;font-size:13px;line-height:1.6}.panel{background:white;border:1px solid #e0e5eb;border-radius:16px;padding:17px;margin:15px 0;box-shadow:0 2px 8px #15263c08}label{display:block;font-weight:600;margin:12px 0 6px}textarea,select,input[type=file],button{font:inherit;width:100%;padding:12px;border-radius:10px}textarea,select,input[type=file]{border:1px solid #aab6c4;background:#fff}textarea{resize:vertical;min-height:90px}button{background:#244b78;color:white;border:0;margin:10px 0 2px;font-weight:650;min-height:46px}button.secondary{background:#e9edf2;color:#1d324b}button.danger{background:#7a3a3a}button:disabled{opacity:.5}.chip{display:inline-block;border-radius:99px;background:#edf0f4;padding:5px 11px;font-size:13px;font-weight:650}.high{background:#ffe6df;color:#812c1c}.medium{background:#fff0c9;color:#70520a}.unknown{background:#e9edf2;color:#34475b}.checkline{display:flex;gap:9px;align-items:flex-start;margin:12px 0}.checkline input{width:20px;height:20px;flex-shrink:0}.checkline label{margin:0;font-weight:400}.entry{border-top:1px solid #e2e5e9;padding:14px 0;overflow-wrap:anywhere}.entry:first-child{border-top:0}.entry p{margin:8px 0}.entry select{margin-top:9px}.note{background:#f4f6f9;padding:12px;border-radius:10px;line-height:1.65}#result[hidden]{display:none}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.row button{width:auto;padding:9px 14px}.error{color:#9d2c20;font-weight:650}details{margin-top:12px}summary{cursor:pointer;font-weight:600}</style></head><body><h1>ワンクッション <small>v4</small></h1><p class="muted">思いつきは消さず、実行の前に確認する。これは医療的な診断や専門家の安全確認に代わるものではありません。</p><div id="storageNotice" class="note" role="status" hidden></div><section class="panel"><h2>今から何をしますか？</h2><label for="idea">思いついた行動</label><textarea id="idea" placeholder="例：ベランダの塗料を薄め液で落とす"></textarea><label for="category">種類</label><select id="category"><option>生活</option><option>買い物</option><option>仕事・開発</option><option>その他</option></select><p class="muted">保存可能な環境では、入力途中の文章も端末内に一時保存します。</p><button id="check">ワンクッション置く</button><div id="result" hidden aria-live="polite"><hr><div id="assessment"></div><div class="note" id="reason"></div><p id="advice"></p><label class="checkline"><input type="checkbox" id="reversible"><span>元に戻せるか、確認した</span></label><label class="checkline"><input type="checkbox" id="consequence"><span>失敗した場合の影響を確認した</span></label><label class="checkline"><input type="checkbox" id="alternative"><span>待つ・調べる・別の方法を検討した</span></label><p class="muted">この判定とチェック項目は判断の補助です。すべて確認しても安全を保証するものではありません。実行前に必要な情報や専門家の確認を得てください。</p><p class="muted" id="pendingMessage"></p><button id="saveHold">保留として保存</button><button id="saveDone" class="secondary" disabled>行動の完了を確認して実行済みとして記録</button><button id="saveCancel" class="secondary">中止として記録</button></div></section><section class="panel"><div class="row"><h2>保留・履歴</h2><span class="chip" id="count"></span></div><div id="history"></div><p class="muted">保留した行動は、実行・中止に変更できます。結果や気づきも記録できます。</p><details><summary>バックアップと復元</summary><button id="export" class="secondary">JSONをバックアップ</button><label for="import">JSONファイルから復元</label><input id="import" type="file" accept="application/json,.json"><p class="muted">復元は現在の履歴を置き換えます。Safariのデータ削除などで履歴が消える場合があります。定期的にバックアップしてください。</p></details></section><script>
'use strict';
const KEY='one-cushion.records.v1';const DRAFT_KEY='one-cushion.draft.v1';const $=id=>document.getElementById(id);let records=[],readOnly=false,storageAvailable=true,pending=null;
try{const parsed=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(parsed))throw Error('保存形式が不正');records=parsed;}catch(e){storageAvailable=false;readOnly=true;const n=$('storageNotice');n.hidden=false;n.textContent='この表示環境では端末への保存を利用できません。危険度の確認はできますが、履歴の保存・復元はできません。Safariでの利用を推奨します。';}
const high=[[/薄め液|シンナー|ラッカー|薬品|溶剤|漂白|塗装|剥が|研磨/,'薬品や表面加工は素材を傷める可能性があります。'],[/削除|初期化|フォーマット|消去|リセット/,'データや設定を元に戻せない可能性があります。'],[/振込|送金|投資|契約|解約|購入|支払/,'金銭や契約に関わる変更は取り消せない場合があります。'],[/分解|配線|電気|火|修理/,'けがや機器の損傷につながる可能性があります。']];const mid=[[/掃除|洗う|交換|変更|注文|設定|移動|捨てる|売る|買う/,'対象物や設定が変わるため、元に戻す方法を確認してください。']];
function assess(action,category){for(const [re,reason] of high)if(re.test(action))return {risk:'高',reason};for(const [re,reason] of mid)if(re.test(action))return {risk:'中',reason};if(category==='買い物'||category==='仕事・開発')return {risk:'要確認',reason:'金額・データ・他者への影響は文章だけでは判断できません。'};return {risk:'要確認',reason:'キーワードに該当しませんでした。安全だと判定したわけではありません。'};}
function persist(next){if(readOnly){records=next;return;}try{localStorage.setItem(KEY,JSON.stringify(next));records=next;}catch(e){readOnly=true;storageAvailable=false;records=next;const n=$('storageNotice');n.hidden=false;n.textContent='端末への保存に失敗しました。以後の記録はこの画面を開いている間だけ保持されます。必要ならJSONバックアップをお試しください。';}}
function updateButtons(){const all=['reversible','consequence','alternative'].every(id=>$(id).checked);$('saveDone').disabled=!pending||!all;$('pendingMessage').textContent=all?'チェック項目を確認しました。安全の保証ではありません。実際に行動を完了した場合だけ、実行済みとして記録してください。':'実行済みの記録には、3項目の確認が必要です。';}
try{const draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(draft&&typeof draft.action==='string'){$('idea').value=draft.action;if(['生活','買い物','仕事・開発','その他'].includes(draft.category))$('category').value=draft.category;}}catch(e){}
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({action:$('idea').value,category:$('category').value}));}catch(e){}}
function invalidateAssessment(){pending=null;$('result').hidden=true;for(const id of ['reversible','consequence','alternative'])$(id).checked=false;updateButtons();}
function inputChanged(){invalidateAssessment();saveDraft();}
$('idea').addEventListener('input',inputChanged);$('category').addEventListener('change',inputChanged);
function currentAssessment(){if(!pending)return false;if(pending.action!==$('idea').value.trim()||pending.category!==$('category').value){invalidateAssessment();alert('入力が変わりました。もう一度「ワンクッション置く」で確認してください。');return false;}return true;}
function confirmCompleted(action){return confirm('「'+action+'」を実際に完了しましたか？\nこれから行う予定ならキャンセルしてください。チェック項目や判定は安全を保証しません。');}
$('check').onclick=()=>{const action=$('idea').value.trim();if(!action){alert('行動を入力してください');return}const category=$('category').value;const a=assess(action,category);pending={action,category,...a};$('result').hidden=false;const badge=document.createElement('span');badge.className='chip '+(a.risk==='高'?'high':a.risk==='中'?'medium':'unknown');badge.textContent='簡易危険度：'+a.risk;$('assessment').replaceChildren(badge);$('reason').textContent='判定理由：'+a.reason;$('advice').textContent=a.risk==='高'?'推奨：いったん保留。材料・対象物・費用・身体・データへの影響を確認してください。':'推奨：実行前に、取り消せるか、失敗時の影響を確認してください。';for(const id of ['reversible','consequence','alternative'])$(id).checked=false;updateButtons();$('result').scrollIntoView({behavior:'smooth',block:'nearest'});};
for(const id of ['reversible','consequence','alternative'])$(id).onchange=updateButtons;
function record(status){if(!currentAssessment())return;if(status==='実行'&&(!['reversible','consequence','alternative'].every(id=>$(id).checked)||!confirmCompleted(pending.action)))return;const now=new Date().toISOString();const r={id:(globalThis.crypto&&typeof crypto.randomUUID==='function'?crypto.randomUUID():'oc-'+Date.now()+'-'+Math.random().toString(36).slice(2)),created_at:now,updated_at:now,action:pending.action,category:pending.category,risk:pending.risk,status,notes:'',risk_reason:pending.reason,checks:{reversible:$('reversible').checked,consequence:$('consequence').checked,alternative:$('alternative').checked}};try{persist([...records,r]);$('idea').value='';saveDraft();$('result').hidden=true;pending=null;draw();}catch(e){alert('保存できませんでした。端末の空き容量やSafariの設定を確認してください。');}}
$('saveHold').onclick=()=>record('保留');$('saveDone').onclick=()=>record('実行');$('saveCancel').onclick=()=>record('中止');
function draw(){const root=$('history');root.replaceChildren();$('count').textContent='保留 '+records.filter(r=>r.status==='保留').length+' 件';if(!records.length){root.textContent='記録はまだありません。';return}for(const r of [...records].reverse()){const wrap=document.createElement('div');wrap.className='entry';const p=document.createElement('p');p.style.fontWeight='650';p.textContent=r.action;wrap.append(p);const detail=document.createElement('small');detail.textContent=[r.category,r.risk,r.created_at?new Date(r.created_at).toLocaleString('ja-JP'):''].filter(Boolean).join(' ／ ');wrap.append(detail);if(r.risk_reason){const reason=document.createElement('p');reason.className='muted';reason.textContent=r.risk_reason;wrap.append(reason)}const select=document.createElement('select');select.setAttribute('aria-label','行動の状態');for(const st of ['保留','実行','中止']){const o=document.createElement('option');o.value=st;o.textContent=st;select.append(o)}select.value=['保留','実行','中止'].includes(r.status)?r.status:'保留';select.disabled=false;select.onchange=()=>{if(select.value==='実行'&&r.status!=='実行'&&!confirmCompleted(r.action)){select.value=['保留','実行','中止'].includes(r.status)?r.status:'保留';return;}const next=records.map(x=>x===r?{...x,status:select.value,updated_at:new Date().toISOString()}:x);try{persist(next);draw()}catch(e){alert('変更を保存できませんでした');draw()}};wrap.append(select);const memo=document.createElement('textarea');memo.setAttribute('aria-label','結果や気づき');memo.placeholder='結果・気づき（任意）';memo.value=typeof r.notes==='string'?r.notes:'';memo.rows=2;memo.disabled=false;const memoSave=document.createElement('button');memoSave.className='secondary';memoSave.textContent='メモを保存';memoSave.disabled=false;memoSave.onclick=()=>{try{persist(records.map(x=>x.id===r.id?{...x,notes:memo.value,updated_at:new Date().toISOString()}:x));draw()}catch(e){alert('メモを保存できませんでした')}};wrap.append(memo,memoSave);root.append(wrap)}}
$('export').onclick=()=>{const payload={schema_version:1,exported_at:new Date().toISOString(),records};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='one-cushion-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)};
$('import').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('ファイルが大きすぎます');const obj=JSON.parse(await file.text());if(obj.schema_version!==1||!Array.isArray(obj.records)||!obj.records.every(r=>r&&typeof r.id==='string'&&typeof r.action==='string'&&typeof r.created_at==='string'&&['保留','実行','中止'].includes(r.status)))throw Error('形式が違います');if(new Set(obj.records.map(r=>r.id)).size!==obj.records.length)throw Error('IDが重複しています');if(!confirm('現在の履歴をバックアップの内容で置き換えますか？'))return;persist(obj.records);draw();alert('復元しました')}catch(err){alert('復元できません：'+err.message)}finally{e.target.value=''}};
$('import').disabled=readOnly;draw();
</script></body></html>
